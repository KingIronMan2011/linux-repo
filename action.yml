name: Publish Linux packages
description: Upload one or many native Debian, RPM, or Arch packages to repo.kingironman.dev.
inputs:
  token:
    description: The LINUX_REPO_PUBLISH_TOKEN GitHub Actions secret
    required: true
  manifest:
    description: Path to a JSON array of packages to publish
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_MANIFEST: ${{ inputs.manifest }}
      run: |
        set -euo pipefail
        test -f "$INPUT_MANIFEST"
        jq -e 'type == "array" and length > 0' "$INPUT_MANIFEST" >/dev/null
        while IFS= read -r item; do
          format="$(jq -r '.format' <<<"$item")"
          package="$(jq -r '.package' <<<"$item")"
          endpoint="https://repo.kingironman.dev/api/v1/packages/${format}"
          test -f "$package"
          case "$format" in
            debian) query="" ;;
            rpm)
              release="$(jq -r '.release // empty' <<<"$item")"
              arch="$(jq -r '.arch // empty' <<<"$item")"
              test -n "$release" && test -n "$arch"
              query="?release=${release}&arch=${arch}"
              ;;
            arch)
              arch="$(jq -r '.arch // empty' <<<"$item")"
              test -n "$arch"
              query="?arch=${arch}"
              ;;
            *) echo "format must be debian, rpm, or arch" >&2; exit 2 ;;
          esac
          curl -fsS --fail-with-body -X POST "${endpoint}${query}" \
            -H "Authorization: Bearer ${INPUT_TOKEN}" \
            -F "package=@${package}"
        done < <(jq -c '.[]' "$INPUT_MANIFEST")
